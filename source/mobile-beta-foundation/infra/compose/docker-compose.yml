services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: athletica
      POSTGRES_USER: athletica
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athletica -d athletica"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
      args:
        VERSION: local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ATHLETICA_ENV: development
      ATHLETICA_HTTP_ADDR: ":8080"
      # The Android client talks to http://10.0.2.2:8080/api/v1 (the emulator's
      # alias for the host), so the service must serve the versioned base path.
      ATHLETICA_BASE_PATH: /api/v1
      ATHLETICA_STORE_DRIVER: postgres
      ATHLETICA_DATABASE_URL: postgres://athletica:local-development-only@postgres:5432/athletica?sslmode=disable
      ATHLETICA_MIGRATE_ON_START: "true"
      ATHLETICA_LOG_LEVEL: info
      # Local placeholder only. ATHLETICA_ENV=production refuses to start with
      # this value, by design (audit finding H5).
      ATHLETICA_JWT_SECRET: dev-only-change-me
      ATHLETICA_ACCESS_TOKEN_TTL: 15m
      ATHLETICA_REFRESH_TOKEN_TTL: 720h
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
