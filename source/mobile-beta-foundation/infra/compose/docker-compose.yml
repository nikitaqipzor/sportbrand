services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: athletica
      POSTGRES_USER: athletica
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athletica -d athletica"]
      interval: 5s
      timeout: 5s
      retries: 10
