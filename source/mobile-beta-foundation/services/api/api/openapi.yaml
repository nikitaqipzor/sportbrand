openapi: 3.1.0
info:
  title: Athletica AI API
  version: 0.6.0
  description: |
    Phase 1 surface of the Athletica AI backend: liveness, authentication with
    logout and token revocation, the idempotent workout-set write, the workout
    lifecycle, the workout history behind the "Итоги" screen and the aggregates
    behind the "Прогресс" screen.

    Three rules hold across the whole contract:

    * the caller's user ID always comes from the bearer access token, never from
      a request body, a query parameter or a cursor;
    * a workout that belongs to another user answers exactly like a workout that
      does not exist (`404`), so existence never leaks;
    * a state change the lifecycle forbids answers `409 invalid_transition` —
      never `500`, and never a silent no-op.

    ### Changes in 0.6.0 (all additive, 0.5.0 clients keep working)

    The **exercise reference book** — the server half of the domain that opens
    prototype screens 13 (Каталог), 14 (Упражнение) and 15 (Техника), and that
    the workout constructor and the restrictions screen need underneath them.

    * `GET /exercises` — the catalogue: filters by machine code (`sport`,
      `section`, `equipment`, `muscle`, `difficulty`), a name search (`q`) and
      the same opaque keyset pagination `GET /workouts` uses;
    * `GET /exercises/{exerciseId}` — one card, with technique, programming,
      safety and media;
    * `GET /exercise-dictionaries` — every machine code with its localized name,
      so the client builds its filter controls from the server's vocabulary
      instead of a hard-coded list that drifts.

    **The catalogue belongs to nobody.** It is shared content, not user data, so
    unlike every other route here nothing about the answer depends on who asked
    — two accounts see the same rows. It is authenticated all the same.

    **`exerciseId` is immutable, and that is the whole point.** The identifier
    already left the phone inside `clientMutationId`
    (`workoutId:exerciseId:setNumber`) and is stored in recorded sets. The
    importer (`api seed-exercises`) therefore **refuses** any file that would
    move a `SLUG` or a `LEGACY_NUMBER` from one identifier to another, and
    refuses it whole — a rename would silently detach an athlete's history from
    the exercise it was performed with. Nothing is ever deleted either: a record
    an import omits is reported and left alone.

    There is deliberately **no foreign key** from a logged set to this
    catalogue. A set naming an exercise the catalogue has not shipped yet, or
    has retired, still records: the training history outranks the reference book.

    **Three independent statuses decide visibility.** `publicationStatus`
    (`draft → in_review → ready → published → archived`), `reviewStatus` (expert
    review) and `mediaStatus` (visual material) are separate, and a record is
    visible only at `published` + `approved` + `approved`. Anything short of
    that answers `404`, byte-identical to an identifier that never existed.

    **Empty is honest.** The source encyclopedia has no step-by-step technique,
    no common errors and no contraindications. Those fields exist in the schema
    and come back as empty arrays, with `hasTechnique` and `hasSafety` saying so
    outright, because a plausible invention is worse than a blank: people train
    on what this says.

    **Search is a literal.** `q` is matched as a case-folded substring, never as
    a pattern and never as a regular expression, so `%`, `_`, `\\` and a quote
    are ordinary characters. An empty or whitespace-only `q` is not a filter.

    ### Changes in 0.5.0 (all additive, 0.4.0 clients keep working)

    * `PATCH /workouts/{workoutId}/sets/{setId}` corrects a logged set;
    * `DELETE /workouts/{workoutId}/sets/{setId}` removes one, softly;
    * `PATCH /workouts/{workoutId}` names a workout after it was started —
      the session begun offline with no title is what it exists for;
    * `WorkoutSet` gained the optional `updatedAt` and `deletedAt` fields;
    * error codes `set_deleted` and `workout_not_editable` were added;
    * metrics are exported in Prometheus text form on a **separate** listener
      (`ATHLETICA_METRICS_ADDR`, loopback by default, `ATHLETICA_METRICS_TOKEN`
      to require a bearer token). They are deliberately **not** part of this
      contract: the public port answers `/metrics` with the ordinary `404`.

    **The rules an edit and a deletion follow.** Both are mutations out of the
    same offline outbox as the set write, so both carry their own
    `clientMutationId` and both are settled by a unique index in the database
    rather than by a check in application code. A replayed edit answers `409
    duplicate_client_mutation` with the stored set and is *not* applied twice; a
    repeated deletion answers `200` with the already-deleted set, because the
    state it asks for is the state that already holds.

    **Deletion is soft.** The row keeps holding its
    `(user_id, clientMutationId)` slot, so replaying the *creation* of a removed
    set out of the outbox answers `409` with `deletedAt` set instead of
    resurrecting it. A deleted set is absent from `GET /workouts/{id}`, from
    `GET /workouts/{id}/sets` and from every figure in `GET /progress`.

    **Set numbers never shift.** Deleting the set in the middle leaves the
    others numbered as they were — `1, 3, 4` — because the client derives its
    mutation ID as `workoutId:exerciseId:setNumber`, and a renumbering would
    make an already-spent ID name a different set. For the same reason
    `exerciseId` and `setNumber` are not correctable: a set logged against the
    wrong exercise is deleted and logged again.

    **A finished workout is still correctable.** The athlete usually notices a
    mistyped weight on the "Итоги" screen, which only exists once the session is
    completed; refusing the edit there would leave the wrong number permanently
    unfixable, which is the problem the endpoint solves. Only a `cancelled`
    workout is closed to edits (`409 workout_not_editable`): that session was
    thrown away, and its sets already count towards nothing.

    ### Changes in 0.3.0 (all additive, 0.2.0 clients keep working)

    * `POST /auth/logout`, `POST /auth/logout-all`;
    * `GET /workouts`, `GET /workouts/{workoutId}`,
      `POST /workouts/{workoutId}/status`;
    * `GET /progress`;
    * `Workout` gained the optional `updatedAt` and `endedAt` fields;
    * error codes `invalid_transition` and `invalid_cursor` were added;
    * refreshing a *logged-out* token answers `401` without revoking the
      account's other sessions (replaying a *rotated* token still does).

servers:
  - url: http://10.0.2.2:8080/api/v1
    description: Android emulator against a local docker compose stack
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: health
  - name: auth
  - name: workouts
  - name: progress
  - name: exercises

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness of the service and reachability of the database
      security: []
      responses:
        '200':
          description: API and database are healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: The database cannot be reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/register:
    post:
      tags: [auth]
      summary: Create an account and start a session
      description: |
        Rate limited per source IP and per e-mail address. A collision counts as
        a failed attempt, so the endpoint cannot be used to enumerate accounts
        cheaply.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: The address cannot be registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a session
      description: |
        Every failure — unknown address, wrong password, malformed address —
        answers with the identical `401 invalid_credentials` body, and costs
        comparable server time. Throttled per source IP and per account, with
        exponential backoff after repeated failures.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token
      description: |
        The presented refresh token is always revoked. Replaying a token that
        rotation already spent is treated as a compromise and revokes every
        session of that user.

        A token that `/auth/logout` revoked is simply refused with `401` and
        leaves the other sessions alone: a background refresh racing a logout on
        the same device must not sign the athlete out everywhere.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: The refresh token is unknown, expired or already spent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the session behind a refresh token
      description: |
        Revokes the presented refresh token. No access token is required — a
        client logging out may well be holding an expired one.

        The answer is `204` whatever was presented: an unknown, expired or
        already spent handle is indistinguishable from a live one, so the
        endpoint cannot be used to probe which refresh tokens exist. Throttled
        per source IP and per presented token, like `/auth/refresh`.

        `allSessions: true` additionally revokes every refresh token of the
        account the handle belongs to.

        A later `/auth/refresh` with a logged-out handle answers `401` and
        touches nothing else — unlike replaying a token rotation spent, which
        still revokes the whole family.

        **Known limitation:** the access token already in the client's hands
        stays valid until it expires (`expiresIn`, at most one hour, 15 minutes
        by default). The service keeps no access-token denylist. A client that
        logs out must discard both tokens locally.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
                allSessions:
                  type: boolean
                  default: false
                  description: Also revoke every other session of this account.
      responses:
        '204':
          description: The session is gone, or was never there. No body.
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke every session of the authenticated account
      description: |
        Revokes every refresh token of the account behind the access token. The
        subject comes from the verified token; a `userId` in the body is
        ignored. Same access-token caveat as `/auth/logout`.
      responses:
        '204':
          description: Every session of the caller has been revoked. No body.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      summary: The account behind the current access token
      responses:
        '200':
          description: The authenticated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workouts:
    post:
      tags: [workouts]
      summary: Start a workout owned by the authenticated user, idempotently
      description: |
        The client may name the workout it is starting by sending `id`. That is
        what makes an offline session possible: the phone can begin training
        with no connection and still have one identity to hang its sets on —
        the same reasoning that gives every set a `clientMutationId`.

        Replaying a create with an `id` the caller already holds returns the
        stored workout with `200`, never a second session, and never rewrites
        its title. An `id` held by another account answers `409
        workout_id_taken` without confirming that it exists.

        Omit `id` and the server generates one, exactly as before.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Client-chosen identity for this workout. Must be a UUID.
                title: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Workout created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workout' }
        '200':
          description: |
            This caller had already started a workout with that `id`; the stored
            row is returned unchanged so a retry after a lost response settles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workout' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The `id` is already in use by another account (`workout_id_taken`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

    get:
      tags: [workouts]
      summary: List the caller's workouts, newest first
      description: |
        The history behind the "Итоги" screen. Ordered by `createdAt` descending
        with the workout ID as tiebreaker, and paged with an opaque keyset
        cursor: pass the `nextCursor` of a page back as `cursor` to continue.

        A cursor is opaque and carries no identity — it only ever moves a
        position inside the caller's own rows, so one copied from another
        account cannot widen the result.
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Repeat the parameter or pass a comma-separated list. Omit for every
            status.
          schema:
            type: array
            items: { $ref: '#/components/schemas/WorkoutStatus' }
          style: form
          explode: true
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on `createdAt` (RFC 3339 or `YYYY-MM-DD`, read as UTC).
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on `createdAt`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Opaque `nextCursor` from a previous page.
          schema: { type: string }
      responses:
        '200':
          description: One page of the caller's workouts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPage' }
        '400':
          description: |
            A filter value is malformed — an unknown status, an unparsable date,
            a limit out of range, or a cursor this API did not issue
            (`invalid_cursor`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workouts/{workoutId}:
    parameters:
      - name: workoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workouts]
      summary: One of the caller's workouts with its sets
      description: |
        The detail behind the "Итоги" screen: the workout, every set it holds
        ordered by set number, and their totals.
      responses:
        '200':
          description: The workout and its sets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/WorkoutNotFound' }
    patch:
      tags: [workouts]
      summary: Name a workout after it was started
      description: |
        A session begun offline carries no title; this is how it gets one.
        Only the title changes — the status, `createdAt` and `endedAt` are
        untouched, and there is no way to reach the lifecycle from here.

        `clientMutationId` is **optional**. A rename converges on the title it
        carries, so one typed into a connected client needs no ID and is
        last-write-wins. One queued in the offline outbox should carry an ID:
        replaying it then answers `200` with the workout unchanged instead of
        overwriting a newer title.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 200
                  description: Trimmed before it is stored; an empty string clears the name.
                clientMutationId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Optional; present for a rename queued offline.
      responses:
        '200':
          description: The workout as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workout' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/WorkoutNotFound' }
        '409':
          description: |
            `duplicate_client_mutation` — this `clientMutationId` was already
            spent on a different change; generate a new one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workouts/{workoutId}/status:
    parameters:
      - name: workoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [workouts]
      summary: Move a workout through its lifecycle
      description: |
        The whole transition table:

        | from | to |
        | --- | --- |
        | `active` | `paused`, `completed`, `cancelled` |
        | `paused` | `active`, `completed`, `cancelled` |
        | `completed` | — terminal |
        | `cancelled` | — terminal |

        Cancelling is reachable from every unfinished status, so a session can
        always be abandoned (audit blocker QA-004).

        Asking for the status the workout already holds is an accepted no-op
        that answers `200` with the unchanged workout, so a client retrying a
        request whose response it never saw is not punished with a `409`.

        Anything else the table forbids — completing a cancelled workout,
        resuming a completed one — answers `409 invalid_transition` and leaves
        the workout exactly as it was. The check and the write happen in one
        atomic statement, so two concurrent requests cannot both win.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/WorkoutStatus' }
      responses:
        '200':
          description: The workout is now in the requested status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workout' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/WorkoutNotFound' }
        '409':
          description: The current status does not allow this transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: invalid_transition
                  message: this workout cannot move to completed from its current status
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workouts/{workoutId}/sets:
    parameters:
      - name: workoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [workouts]
      summary: Log one strength-training set idempotently
      description: |
        The set is stored under the user ID carried by the access token; a
        `userId` field in the body is ignored.

        Idempotency rests on a unique index on `(user_id, client_mutation_id)`
        in PostgreSQL, so a retried outbox entry can never create a second row,
        even when two requests race. Replaying a mutation ID returns `409` with
        the originally stored set — including when the replayed payload differs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutSetInput' }
      responses:
        '201':
          description: Set logged
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/WorkoutNotFound' }
        '409':
          description: |
            Duplicate client mutation. The body carries the set that was stored
            when this clientMutationId was first accepted.
          content:
            application/json:
              schema:
                type: object
                required: [error, set]
                properties:
                  error: { $ref: '#/components/schemas/ErrorPayload' }
                  set: { $ref: '#/components/schemas/WorkoutSet' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [workouts]
      summary: List the sets of one of the caller's workouts
      responses:
        '200':
          description: Sets of the workout, ordered by set number
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkoutSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/WorkoutNotFound' }

  /workouts/{workoutId}/sets/{setId}:
    parameters:
      - name: workoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: setId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workouts]
      summary: Correct a logged set
      description: |
        The three values a human mistypes — `weightKg`, `repetitions`, `rir` —
        and nothing else. They are **all required**: a replay out of the outbox
        is then byte-identical to the mutation that was applied, and a partial
        patch cannot silently reset the field it omitted.

        `exerciseId` and `setNumber` are deliberately not correctable. The
        client derives `clientMutationId` as `workoutId:exerciseId:setNumber`,
        so those two are the identity of the queued write; a set logged against
        the wrong exercise is deleted and logged again.

        The correction is held to exactly the same domain bounds as the original
        write, so editing is not a way around them.

        Idempotency works as it does everywhere else in this contract: the pair
        `(user, clientMutationId)` is unique in the database, a replay answers
        `409 duplicate_client_mutation` with the stored set, and the edit is
        never applied twice — not even when two retries race.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutSetPatch' }
      responses:
        '200':
          description: The correction was applied; the body is the set as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SetNotFound' }
        '409':
          description: |
            * `duplicate_client_mutation` — this `clientMutationId` was already
              applied (the body then carries the stored `set`), or was spent on
              a different change;
            * `set_deleted` — the athlete already removed this set;
            * `workout_not_editable` — the workout was cancelled.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [error, set]
                    properties:
                      error: { $ref: '#/components/schemas/ErrorPayload' }
                      set: { $ref: '#/components/schemas/WorkoutSet' }
                  - $ref: '#/components/schemas/Error'
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [workouts]
      summary: Remove a logged set
      description: |
        The deletion is **soft**. The row stays, keeping its
        `(user, clientMutationId)` slot, so replaying the *creation* of this set
        out of the outbox answers `409` with `deletedAt` set rather than
        resurrecting it. The set disappears from the workout detail, from the
        set list and from every progress aggregate.

        Repeating a deletion is always safe and always answers `200` with the
        already-deleted set — the state the caller asked for is the state that
        holds. This is the one place a replay is not a `409`: a deletion
        converges, an edit does not.

        `clientMutationId` is required and may travel either in the JSON body or
        as a query parameter, for clients and proxies that drop a body from a
        `DELETE`; the body wins when both are present.

        The remaining sets are **not** renumbered. Deleting set 2 of 4 leaves
        1, 3 and 4 — a gap, not a shift, because the client's deterministic
        mutation ID is built from the set number.
      parameters:
        - name: clientMutationId
          in: query
          required: false
          description: |
            The mutation ID, when it cannot be sent in the body. It carries no
            identity: the owner still comes from the access token alone.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [clientMutationId]
              properties:
                clientMutationId: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: |
            The set is deleted. Identical whether this call did the deleting or
            found it already done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SetNotFound' }
        '409':
          description: |
            * `workout_not_editable` — the workout was cancelled;
            * `duplicate_client_mutation` — this `clientMutationId` was spent on
              a different change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /progress:
    get:
      tags: [progress]
      summary: Strength records, weekly volume and plan adherence
      description: |
        Everything the "Прогресс" screen needs, in one round trip. Every figure
        is aggregated by the database; set rows never travel into the service.

        **What counts.** Sets of `cancelled` workouts are excluded from
        `strength` and `weeklyVolume` — a session the athlete threw away must
        not become a personal record. `adherence` counts workouts by the week
        they were *started* in, whatever their status.

        **The window.** `from`/`to` are snapped outwards to whole ISO weeks
        (Monday 00:00 UTC) and clamped to at most 104 weeks; the resolved range
        is echoed back in `window`, and `weekStart` values are those Mondays.
        The default is the last 12 weeks including the current one.

        **`estimated1RmKg`** is the Epley estimate of the performed set,
        `weightKg × (1 + repetitions / 30)`. RIR is deliberately not folded in:
        the number describes the set that was actually done.
      parameters:
        - name: from
          in: query
          required: false
          description: Start of the window (RFC 3339 or `YYYY-MM-DD`, read as UTC).
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: End of the window; defaults to the current week.
          schema: { type: string }
        - name: exerciseLimit
          in: query
          required: false
          description: How many exercises the `strength` table may hold.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: The progress report over the resolved window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '400':
          description: A window bound or the limit is malformed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /exercises:
    get:
      tags: [exercises]
      summary: The exercise catalogue, filtered by machine code and paged
      description: |
        The list behind prototype screen 13 (Каталог). Ordered by the folded
        Russian name with the identifier as tiebreaker, and paged with an opaque
        keyset cursor: pass a page's `nextCursor` back as `cursor` to continue.

        **Only published exercises are returned** — `publicationStatus`
        `published` together with `reviewStatus` and `mediaStatus` `approved`.
        There is no parameter that widens that.

        Every filter takes machine codes from `GET /exercise-dictionaries`,
        repeated or comma separated. A code no dictionary defines is not an
        error: it simply matches nothing, so a client built against an older
        dictionary gets an empty page rather than a failure it cannot act on.

        The catalogue is shared content and carries no owner, so a cursor from
        another account is not a leak — it is merely another position in the
        same public list.
      parameters:
        - name: sport
          in: query
          required: false
          description: Machine codes from the `sport` dictionary.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: section
          in: query
          required: false
          description: Machine codes from the `section` dictionary.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: equipment
          in: query
          required: false
          description: Machine codes from the `equipment` dictionary.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: muscle
          in: query
          required: false
          description: |
            Machine codes from the `muscle` dictionary. A record matches whether
            the muscle is loaded primarily or secondarily.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: difficulty
          in: query
          required: false
          description: Machine codes from the `difficulty` dictionary.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: q
          in: query
          required: false
          description: |
            Case-insensitive **literal** substring of the Russian name, the
            English name, an alias or the identifier. Not a pattern and not a
            regular expression: `%`, `_`, `\\` and a quote are ordinary
            characters. Empty or whitespace-only means "no search"; anything
            longer than 120 bytes is truncated rather than refused.
          schema: { type: string, maxLength: 120 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          description: Opaque `nextCursor` from a previous page.
          schema: { type: string }
      responses:
        '200':
          description: One page of the published catalogue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExercisePage' }
        '400':
          description: |
            `limit` is out of range, or `cursor` is not one this API issued
            (`invalid_cursor`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /exercises/{exerciseId}:
    get:
      tags: [exercises]
      summary: One exercise in full
      description: |
        The card behind prototype screens 14 (Упражнение) and 15 (Техника).

        `exerciseId` is the immutable string the client also sends when logging
        a set and inside `clientMutationId`. An exercise that is not published
        answers `404` with a body byte-identical to an identifier that has never
        existed, so a draft never leaks through the catalogue.

        The `technique` and `safety` blocks come back as empty arrays for every
        record until the encyclopedia is imported, and `hasTechnique` /
        `hasSafety` say so plainly. A screen must show "нет данных" there, never
        something plausible.
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, maxLength: 64, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
      responses:
        '200':
          description: The exercise card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ExerciseNotFound' }

  /exercise-dictionaries:
    get:
      tags: [exercises]
      summary: Every machine code with its localized name
      description: |
        The vocabulary the catalogue is coded with, so the client builds its
        filter controls from the server instead of a hard-coded list.

        Every kind is present, empty ones included: a client must be able to
        tell "this filter has no values yet" from "there is no such filter", and
        an omitted key cannot say that. A vocabulary may also be larger than the
        catalogue currently uses — `difficulty` ships its three levels before a
        single record claims one — which is deliberate.
      responses:
        '200':
          description: The dictionaries, in a fixed order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseDictionaries' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived HS256 access token issued by /auth/login.

  responses:
    BadRequest:
      description: The body is not a single well-formed JSON object
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, malformed or expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: |
        Authentication failed. Deliberately identical for an unknown address and
        for a wrong password.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: invalid_credentials
              message: invalid email or password
    ValidationFailed:
      description: The payload violates the shared domain rules
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WorkoutNotFound:
      description: |
        The workout does not exist, or belongs to another user. The two cases
        are indistinguishable by design.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SetNotFound:
      description: |
        The set does not exist, is not part of this workout, or belongs to
        another user — and the workout itself may be missing or foreign too.
        Every one of those answers with this identical body by design.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ExerciseNotFound:
      description: |
        The exercise does not exist, or is not published. The two cases are
        indistinguishable by design, so a draft record never leaks.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many attempts from this IP or against this account
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Health:
      type: object
      required: [status, database, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [up, down] }
        version: { type: string }
        time: { type: string, format: date-time }

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 72 }

    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }

    Session:
      type: object
      required: [user, accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Access token lifetime in seconds }
        refreshToken: { type: string }
        refreshExpiresIn: { type: integer, description: Refresh token lifetime in seconds }

    WorkoutStatus:
      type: string
      enum: [active, paused, completed, cancelled]
      description: |
        `active` and `paused` are open states; `completed` and `cancelled` are
        terminal and allow no further transition.

    Workout:
      type: object
      required: [id, title, status, createdAt, updatedAt, endedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: '#/components/schemas/WorkoutStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: When the status last changed. Added in 0.3.0.
        endedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the workout reached a terminal status; `null` while it is still
            active or paused. Added in 0.3.0.

    WorkoutPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Workout' }
        nextCursor:
          type: [string, 'null']
          description: |
            Opaque position to pass back as `cursor` for the next page; `null`
            on the last page. Clients must echo it untouched and never build one.

    WorkoutTotals:
      type: object
      required: [sets, repetitions, volumeKg]
      properties:
        sets: { type: integer }
        repetitions: { type: integer }
        volumeKg:
          type: number
          description: Sum of weightKg × repetitions over the workout's sets.

    WorkoutDetail:
      allOf:
        - $ref: '#/components/schemas/Workout'
        - type: object
          required: [sets, totals]
          properties:
            sets:
              type: array
              items: { $ref: '#/components/schemas/WorkoutSet' }
            totals: { $ref: '#/components/schemas/WorkoutTotals' }

    WorkoutSetInput:
      type: object
      required: [exerciseId, setNumber, weightKg, repetitions, rir, clientMutationId]
      description: |
        Bounds mirror validateSet() in packages/domain/src/workout.ts. Any
        additional property — `userId` in particular — is ignored by the server.
      properties:
        exerciseId: { type: string, minLength: 1, maxLength: 128 }
        setNumber: { type: integer, minimum: 1 }
        weightKg: { type: number, minimum: 0, maximum: 1000 }
        repetitions: { type: integer, minimum: 1, maximum: 100 }
        rir: { type: integer, minimum: 0, maximum: 10 }
        clientMutationId:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable per-mutation ID from the client outbox.

    WorkoutSetPatch:
      type: object
      required: [weightKg, repetitions, rir, clientMutationId]
      description: |
        A correction of an already-logged set. The bounds are the same ones the
        original write was held to, so an edit cannot leave the domain.
        `exerciseId` and `setNumber` are absent on purpose — see the endpoint
        description.
      properties:
        weightKg: { type: number, minimum: 0, maximum: 1000 }
        repetitions: { type: integer, minimum: 1, maximum: 100 }
        rir: { type: integer, minimum: 0, maximum: 10 }
        clientMutationId:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            A *new* ID for this correction, distinct from the one that created
            the set. A client derives it deterministically, e.g.
            `workoutId:exerciseId:setNumber:update:1`.

    WorkoutSet:
      type: object
      required: [id, workoutId, exerciseId, setNumber, weightKg, repetitions, rir, clientMutationId, createdAt, updatedAt, deletedAt]
      properties:
        id: { type: string, format: uuid }
        workoutId: { type: string, format: uuid }
        exerciseId: { type: string }
        setNumber:
          type: integer
          description: |
            The number the client gave the set, never reassigned by the server.
            Gaps are normal after a deletion.
        weightKg: { type: number }
        repetitions: { type: integer }
        rir: { type: integer }
        clientMutationId:
          type: string
          description: |
            The ID of the mutation that *created* the set. A correction does not
            replace it.
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: |
            When the set was last corrected; equal to `createdAt` for a set that
            was never edited. Added in 0.5.0.
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the athlete removed the set; `null` for every set a client can
            still see. It is non-null only in the answer to a deletion and in
            the `409` a replayed creation of a removed set gets. Added in 0.5.0.

    ProgressWindow:
      type: object
      required: [from, to]
      description: The resolved, ISO-week-aligned range every figure below covers.
      properties:
        from: { type: string, format: date-time }
        to:
          type: string
          format: date-time
          description: Exclusive upper bound — the Monday after the last covered week.

    BestWeight:
      type: object
      required: [weightKg, repetitions, achievedAt]
      description: The heaviest set performed for this exercise in the window.
      properties:
        weightKg: { type: number }
        repetitions: { type: integer }
        achievedAt: { type: string, format: date-time }

    BestEstimated1Rm:
      type: object
      required: [estimated1RmKg, weightKg, repetitions, achievedAt]
      description: |
        The set with the highest Epley estimate, and the estimate itself:
        `weightKg × (1 + repetitions / 30)`.
      properties:
        estimated1RmKg: { type: number }
        weightKg: { type: number }
        repetitions: { type: integer }
        achievedAt: { type: string, format: date-time }

    ExerciseRecord:
      type: object
      required: [exerciseId, sets, repetitions, volumeKg, bestWeight, bestEstimated1Rm, lastPerformedAt]
      properties:
        exerciseId: { type: string }
        sets: { type: integer }
        repetitions: { type: integer }
        volumeKg: { type: number }
        bestWeight: { $ref: '#/components/schemas/BestWeight' }
        bestEstimated1Rm: { $ref: '#/components/schemas/BestEstimated1Rm' }
        lastPerformedAt: { type: string, format: date-time }

    WeeklyVolume:
      type: object
      required: [weekStart, sets, repetitions, volumeKg, workouts]
      properties:
        weekStart:
          type: string
          format: date-time
          description: Monday 00:00 UTC of the ISO week.
        sets: { type: integer }
        repetitions: { type: integer }
        volumeKg: { type: number }
        workouts:
          type: integer
          description: Distinct workouts that contributed a set that week.

    WeeklyAdherence:
      type: object
      required: [weekStart, started, completed, cancelled, inProgress, completionRate]
      description: How the workouts *started* in this ISO week ended.
      properties:
        weekStart: { type: string, format: date-time }
        started: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        inProgress:
          type: integer
          description: Still active or paused.
        completionRate:
          type: number
          minimum: 0
          maximum: 1
          description: completed / started, 0 when nothing was started.

    AdherenceTotals:
      type: object
      required: [started, completed, cancelled, inProgress, completionRate, weeksInWindow, weeksWithTraining]
      properties:
        started: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        inProgress: { type: integer }
        completionRate: { type: number, minimum: 0, maximum: 1 }
        weeksInWindow: { type: integer }
        weeksWithTraining:
          type: integer
          description: Weeks in which at least one set was logged.

    Progress:
      type: object
      required: [window, strength, weeklyVolume, adherence]
      properties:
        window: { $ref: '#/components/schemas/ProgressWindow' }
        strength:
          type: array
          description: One row per exercise, strongest estimated 1RM first.
          items: { $ref: '#/components/schemas/ExerciseRecord' }
        weeklyVolume:
          type: array
          description: Ascending by week; weeks without training are absent.
          items: { $ref: '#/components/schemas/WeeklyVolume' }
        adherence:
          type: object
          required: [weeks, totals]
          properties:
            weeks:
              type: array
              items: { $ref: '#/components/schemas/WeeklyAdherence' }
            totals: { $ref: '#/components/schemas/AdherenceTotals' }

    ErrorPayload:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - validation_failed
            - unauthorized
            - invalid_credentials
            - email_taken
            - not_found
            - duplicate_client_mutation
            - invalid_transition
            - invalid_cursor
            - workout_id_taken
            - set_deleted
            - workout_not_editable
            - rate_limited
            - internal_error
        message: { type: string }
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorPayload' }

    ExerciseCode:
      type: object
      required: [code, nameRu, nameEn, sortOrder]
      description: |
        One dictionary entry. The app filters on `code` and shows a person
        `nameRu`; there is no filtering on free text anywhere in this contract.
      properties:
        code:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+([-_][a-z0-9]+)*$'
        nameRu: { type: string }
        nameEn: { type: string }
        sortOrder: { type: integer }

    ExerciseDictionary:
      type: object
      required: [kind, items]
      properties:
        kind:
          type: string
          enum:
            - sport
            - section
            - category
            - movement_pattern
            - equipment
            - muscle
            - joint
            - goal_tag
            - difficulty
            - laterality
        items:
          type: array
          items: { $ref: '#/components/schemas/ExerciseCode' }

    ExerciseDictionaries:
      type: object
      required: [dictionaries]
      properties:
        dictionaries:
          type: array
          items: { $ref: '#/components/schemas/ExerciseDictionary' }

    ExerciseSummary:
      type: object
      description: |
        One row of the catalogue: identity, localized names and every machine
        code. Blocks A and B of the master template.
      required:
        [id, slug, nameRu, nameEn, aliases, sport, section, equipment,
         primaryMuscles, secondaryMuscles, joints, goalTags, contentVersion,
         revision, updatedAt, hasTechnique, hasSafety]
      properties:
        id:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: |
            The immutable identifier. It is the same string the client sends as
            `exerciseId` when logging a set and inside `clientMutationId`, and
            no import may ever move it to another record.
        slug: { type: string }
        legacyNumber:
          type: [integer, 'null']
          description: Position 1–918 in the source encyclopedia, where the record has one.
        nameRu: { type: string }
        nameEn: { type: string }
        aliases:
          type: array
          items: { type: string }
        variantOf:
          type: [string, 'null']
          description: |
            The record this one varies, per the master template's variant rule.
            The source's repeated names are linked here, never deleted.
        sport: { type: string }
        section: { type: string }
        category: { type: [string, 'null'] }
        movementPattern: { type: [string, 'null'] }
        difficulty:
          type: [string, 'null']
          description: |
            `null` means the source has not stated a level. It is not "beginner"
            and it must not be rendered as one.
        laterality: { type: [string, 'null'] }
        equipment:
          type: array
          items: { type: string }
        primaryMuscles:
          type: array
          items: { type: string }
        secondaryMuscles:
          type: array
          items: { type: string }
        joints:
          type: array
          items: { type: string }
        goalTags:
          type: array
          items: { type: string }
        contentVersion:
          type: integer
          description: The content version of the import this record came from.
        revision:
          type: integer
          description: |
            How many times this record's content has actually changed. A
            re-import of unchanged content does not move it.
        updatedAt: { type: string, format: date-time }
        hasTechnique:
          type: boolean
          description: |
            Whether the technique block carries anything. It is `false` for every
            record until the encyclopedia is imported, and a screen should say
            "нет данных" rather than imply guidance it does not have.
        hasSafety:
          type: boolean
          description: The same, for common errors, stop signs and contraindications.

    ExercisePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExerciseSummary' }
        nextCursor:
          type: [string, 'null']
          description: |
            Opaque keyset position, `null` on the last page. Echo it back
            untouched; do not construct one.

    ExerciseTechnique:
      type: object
      description: |
        Block C of the master template. Absent from the source encyclopedia and
        therefore empty on every record today — deliberately blank rather than
        plausibly invented, because a person follows what it says.
      required: [setup, startPosition, executionSteps, keyCues, breathing, tempo, rangeOfMotion, finishReturn]
      properties:
        setup: { type: string }
        startPosition: { type: string }
        executionSteps: { type: array, items: { type: string } }
        keyCues: { type: array, items: { type: string } }
        breathing: { type: string }
        tempo: { type: string }
        rangeOfMotion: { type: string }
        finishReturn: { type: string }

    ExerciseProgramming:
      type: object
      description: Block D — how much of the exercise to prescribe.
      properties:
        volumeType: { type: string }
        setsMin: { type: [integer, 'null'] }
        setsMax: { type: [integer, 'null'] }
        repsMin: { type: [integer, 'null'] }
        repsMax: { type: [integer, 'null'] }
        durationMinSeconds: { type: [integer, 'null'] }
        durationMaxSeconds: { type: [integer, 'null'] }
        distanceMinMeters: { type: [number, 'null'] }
        distanceMaxMeters: { type: [number, 'null'] }
        cyclesMin: { type: [integer, 'null'] }
        cyclesMax: { type: [integer, 'null'] }
        restSeconds: { type: [integer, 'null'] }
        intensityType: { type: string }
        intensityMin: { type: [number, 'null'] }
        intensityMax: { type: [number, 'null'] }
        stopCondition: { type: string }

    ExerciseSafety:
      type: object
      description: |
        Block E. Absent from the source and therefore empty, for the same reason
        as the technique block: an invented contraindication is worse than none.
      required: [commonErrors, stopSigns, contraindications, regressions, progressions, injuryNotes]
      properties:
        commonErrors: { type: array, items: { type: string } }
        stopSigns: { type: array, items: { type: string } }
        contraindications: { type: array, items: { type: string } }
        regressions: { type: array, items: { type: string } }
        progressions: { type: array, items: { type: string } }
        injuryNotes: { type: string }

    ExerciseMedia:
      type: object
      description: Block F — visual material. Empty until the media pipeline runs.
      properties:
        mainAssetId: { type: string }
        phaseAssetIds: { type: array, items: { type: string } }
        muscleLayerAssetId: { type: string }
        animationAssetId: { type: string }
        videoUrl: { type: string }
        cameraView: { type: string }
        altText: { type: string }
        mediaRights: { type: string }
        techniqueVersion: { type: string }

    ExerciseCard:
      allOf:
        - $ref: '#/components/schemas/ExerciseSummary'
        - type: object
          required: [technique, programming, safety, media, publicationStatus, reviewStatus, mediaStatus, contentLocale, schemaVersion]
          properties:
            technique: { $ref: '#/components/schemas/ExerciseTechnique' }
            programming: { $ref: '#/components/schemas/ExerciseProgramming' }
            safety: { $ref: '#/components/schemas/ExerciseSafety' }
            media: { $ref: '#/components/schemas/ExerciseMedia' }
            publicationStatus:
              type: string
              enum: [draft, in_review, ready, published, archived]
              description: |
                Always `published` on a served card — the other values exist
                because the client should be able to say *why* a block is empty
                once editorial states become visible to it.
            reviewStatus:
              type: string
              enum: [draft, in_review, approved, rejected]
            mediaStatus:
              type: string
              enum: [draft, in_review, approved, rejected]
            contentLocale: { type: string }
            schemaVersion: { type: integer }
