name: CI

on:
  push:
    # Рабочие ветки проверяются по пушу, а не только через pull request:
    # после слияния PR ветка остаётся, PR исчезает, и работа на ней шла бы
    # вообще без проверки — что однажды уже случилось.
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Ключ по типу события и ветке: пуш и pull request на одну голову — это два
  # прогона одной работы, и второй незачем гонять.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Прогон не отменяется новым пушем.
  #
  # Отмена разумна, пока job'ы короткие. Но сборка APK идёт девять минут, а
  # эмулятор — двадцать: при частых пушах они не доживали до конца ни разу, и
  # приходилось вручную выбирать между «запушить» и «узнать результат».
  # Лишние минуты раннера дешевле, чем ни разу не увиденный результат.
  cancel-in-progress: false

jobs:
  web-prototype:
    name: Веб-прототип
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/web-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/web-prototype/package-lock.json
      - run: npm ci
      - name: Типы
        run: npx tsc --noEmit
      - name: Линт
        run: npm run lint
      - name: Сборка и тесты
        run: npm test

  mobile-foundation:
    name: Мобильный каркас
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/mobile-beta-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/mobile-beta-foundation/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Типы
        run: pnpm typecheck
      - name: Тесты
        run: pnpm test
      - name: Проверка каркаса
        run: node scripts/verify-foundation.mjs

  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/mobile-beta-foundation/services/api
    # SQL-адаптеры невозможно проверить памятью: схема, запросы и сканирование
    # строк живут только против настоящей базы. Именно этот пробел аудит
    # записал как H3 — у store-адаптеров было 0% покрытия, и регрессии
    # переживали unit-гейт.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athletica
          POSTGRES_USER: athletica
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U athletica -d athletica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATHLETICA_TEST_DATABASE_URL: postgres://athletica:ci-only-not-a-secret@localhost:5432/athletica?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: source/mobile-beta-foundation/services/api/go.sum
      - name: Форматирование
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt требует правки:"; echo "$unformatted"; exit 1
          fi
      - name: Сборка
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Тесты
        run: go test ./...
      - name: Тесты с детектором гонок
        run: go test -race ./...
      - name: Conformance-набор против PostgreSQL действительно отработал
        # Пропуск здесь опаснее падения: набор молча выключается отсутствием
        # переменной окружения, и H3 осталась бы открытой, а CI — зелёным.
        run: |
          output=$(go test -run TestPostgresStoreConformance -v ./internal/store/postgres/)
          echo "$output"
          if echo "$output" | grep -q -- '--- SKIP'; then
            echo "::error::Набор против PostgreSQL пропущен — H3 не закрыта"; exit 1
          fi
          echo "$output" | grep -q -- '--- PASS: TestPostgresStoreConformance' || {
            echo "::error::Набор против PostgreSQL не отработал"; exit 1
          }

  android:
    name: Android APK
    runs-on: ubuntu-latest
    # Сборка бандла Metro доказывает только, что JavaScript собирается. Всё
    # остальное — Gradle, нативные модули (SQLite, Keystore, crypto), права,
    # манифест — проверяется исключительно настоящей сборкой. До этого job'а
    # приложение ни разу не собиралось как приложение.
    defaults:
      run:
        working-directory: source/mobile-beta-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/mobile-beta-foundation/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile
      - name: Генерация нативного проекта
        # android/ намеренно не в репозитории: источник истины — app.json,
        # нативный проект генерируется из него (Expo CNG). Так конфигурация не
        # может разъехаться с тем, что реально собирается.
        run: pnpm --filter @athletica/mobile exec expo prebuild --platform android --no-install
      - name: Сборка debug APK
        working-directory: source/mobile-beta-foundation/apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK существует и не пустой
        working-directory: source/mobile-beta-foundation/apps/mobile
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "::error::APK не собран"; exit 1; }
          size=$(stat -c%s "$apk")
          echo "APK: $apk ($size байт)"
          # Пустой или крошечный APK означает, что бандл не доехал внутрь.
          test "$size" -gt 3000000 || { echo "::error::APK подозрительно мал: $size байт"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: athletica-debug-apk
          path: source/mobile-beta-foundation/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: E2E на эмуляторе
    runs-on: ubuntu-latest
    # Юнит-тесты не видят, отрисовался ли экран, нажимается ли кнопка и дожила
    # ли сессия до следующего экрана. Этот job проходит петлю беты на настоящем
    # Android против настоящего API — единственный способ узнать, что
    # приложение работает как приложение.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/mobile-beta-foundation/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: source/mobile-beta-foundation/services/api/go.sum

      - name: Запуск API
        working-directory: source/mobile-beta-foundation/services/api
        # Хранилище в памяти: сценарию нужен чистый сервер на каждый прогон, а
        # не накопленные прошлые аккаунты.
        env:
          ATHLETICA_STORE_DRIVER: memory
          ATHLETICA_HTTP_ADDR: "0.0.0.0:8080"
        run: |
          go build -o /tmp/athletica-api ./cmd/api
          /tmp/athletica-api serve > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/health || { echo "::error::API не поднялся"; cat /tmp/api.log; exit 1; }

      - name: Установка зависимостей
        working-directory: source/mobile-beta-foundation
        run: pnpm install --frozen-lockfile

      - name: Сборка APK
        working-directory: source/mobile-beta-foundation
        # 10.0.2.2 — адрес хоста изнутри эмулятора Android.
        env:
          ATHLETICA_API_URL: http://10.0.2.2:8080/api/v1
          ATHLETICA_ENV: development
        run: |
          pnpm --filter @athletica/mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android && ./gradlew assembleDebug --no-daemon

      - name: Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Петля беты на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r source/mobile-beta-foundation/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            # Логи пишем всегда: при падении сценария причина почти всегда в
            # самом приложении, а Maestro видит только отсутствие элемента.
            adb logcat -c
            adb logcat > /tmp/logcat.txt 2>&1 &
            set +e
            maestro test source/mobile-beta-foundation/apps/mobile/e2e/smoke.yaml
            status=$?
            set -e
            echo "--- ReactNative / ошибки приложения ---"
            grep -E 'ReactNative|ReactNativeJS|AndroidRuntime|FATAL|athletica' /tmp/logcat.txt | tail -80 || true
            exit $status

      - name: Логи API при падении
        if: failure()
        run: cat /tmp/api.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-debug
          path: |
            ~/.maestro/tests/**
            /tmp/api.log
            /tmp/logcat.txt
          if-no-files-found: ignore
          retention-days: 7

  contract:
    name: OpenAPI-контракт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Контракт разбирается и содержит идемпотентную запись подхода
        run: |
          npx --yes js-yaml@4 source/mobile-beta-foundation/services/api/api/openapi.yaml > /dev/null
          grep -q 'clientMutationId' source/mobile-beta-foundation/services/api/api/openapi.yaml
          grep -q '/workouts/{workoutId}/sets' source/mobile-beta-foundation/services/api/api/openapi.yaml
