name: CI

on:
  push:
    # Рабочие ветки проверяются по пушу, а не только через pull request:
    # после слияния PR ветка остаётся, PR исчезает, и работа на ней шла бы
    # вообще без проверки — что однажды уже случилось.
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Ключ по типу события и ветке: пуш и pull request на одну голову — это два
  # прогона одной работы, и второй незачем гонять.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-prototype:
    name: Веб-прототип
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/web-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/web-prototype/package-lock.json
      - run: npm ci
      - name: Типы
        run: npx tsc --noEmit
      - name: Линт
        run: npm run lint
      - name: Сборка и тесты
        run: npm test

  mobile-foundation:
    name: Мобильный каркас
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/mobile-beta-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/mobile-beta-foundation/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Типы
        run: pnpm typecheck
      - name: Тесты
        run: pnpm test
      - name: Проверка каркаса
        run: node scripts/verify-foundation.mjs

  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/mobile-beta-foundation/services/api
    # SQL-адаптеры невозможно проверить памятью: схема, запросы и сканирование
    # строк живут только против настоящей базы. Именно этот пробел аудит
    # записал как H3 — у store-адаптеров было 0% покрытия, и регрессии
    # переживали unit-гейт.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athletica
          POSTGRES_USER: athletica
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U athletica -d athletica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATHLETICA_TEST_DATABASE_URL: postgres://athletica:ci-only-not-a-secret@localhost:5432/athletica?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: source/mobile-beta-foundation/services/api/go.sum
      - name: Форматирование
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt требует правки:"; echo "$unformatted"; exit 1
          fi
      - name: Сборка
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Тесты
        run: go test ./...
      - name: Тесты с детектором гонок
        run: go test -race ./...
      - name: Conformance-набор против PostgreSQL действительно отработал
        # Пропуск здесь опаснее падения: набор молча выключается отсутствием
        # переменной окружения, и H3 осталась бы открытой, а CI — зелёным.
        run: |
          output=$(go test -run TestPostgresStoreConformance -v ./internal/store/postgres/)
          echo "$output"
          if echo "$output" | grep -q -- '--- SKIP'; then
            echo "::error::Набор против PostgreSQL пропущен — H3 не закрыта"; exit 1
          fi
          echo "$output" | grep -q -- '--- PASS: TestPostgresStoreConformance' || {
            echo "::error::Набор против PostgreSQL не отработал"; exit 1
          }

  android:
    name: Android APK
    runs-on: ubuntu-latest
    # Сборка бандла Metro доказывает только, что JavaScript собирается. Всё
    # остальное — Gradle, нативные модули (SQLite, Keystore, crypto), права,
    # манифест — проверяется исключительно настоящей сборкой. До этого job'а
    # приложение ни разу не собиралось как приложение.
    defaults:
      run:
        working-directory: source/mobile-beta-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/mobile-beta-foundation/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile
      - name: Генерация нативного проекта
        # android/ намеренно не в репозитории: источник истины — app.json,
        # нативный проект генерируется из него (Expo CNG). Так конфигурация не
        # может разъехаться с тем, что реально собирается.
        run: pnpm --filter @athletica/mobile exec expo prebuild --platform android --no-install
      - name: Сборка debug APK
        working-directory: source/mobile-beta-foundation/apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK существует и не пустой
        working-directory: source/mobile-beta-foundation/apps/mobile
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "::error::APK не собран"; exit 1; }
          size=$(stat -c%s "$apk")
          echo "APK: $apk ($size байт)"
          # Пустой или крошечный APK означает, что бандл не доехал внутрь.
          test "$size" -gt 3000000 || { echo "::error::APK подозрительно мал: $size байт"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: athletica-debug-apk
          path: source/mobile-beta-foundation/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  contract:
    name: OpenAPI-контракт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Контракт разбирается и содержит идемпотентную запись подхода
        run: |
          npx --yes js-yaml@4 source/mobile-beta-foundation/services/api/api/openapi.yaml > /dev/null
          grep -q 'clientMutationId' source/mobile-beta-foundation/services/api/api/openapi.yaml
          grep -q '/workouts/{workoutId}/sets' source/mobile-beta-foundation/services/api/api/openapi.yaml
